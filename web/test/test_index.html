<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apsakaleidja index test</title>
  <script>
    window.__LAWLAB_TEST__ = true;
  </script>
  <script type="importmap">
    {
      "imports": {
        "/js/api.js": "./stubs/api.js",
        "/js/i18n.js": "./stubs/i18n.js",
        "/js/shell.js": "./stubs/shell.js"
      }
    }
  </script>
  <style>
    .assert { font: 13px/1.4 monospace; }
    .assert.fail { color: #b42318; }
  </style>
</head>
<body>
  <div id="app-shell-header"></div>

  <main id="lawlab-index" class="index-dashboard">
    <header class="index-top">
      <h1>Apsakaleidja</h1>
    </header>

    <section id="stat-cards" class="stat-grid"></section>

    <section class="index-controls">
      <input id="index-search" type="search" autocomplete="off">
      <select id="status-filter"></select>
    </section>

    <section class="table-wrap">
      <table id="bill-table" class="index-table">
        <thead>
          <tr>
            <th data-column="number"></th>
            <th data-column="title"></th>
            <th data-column="status"></th>
            <th data-column="changed"></th>
            <th data-column="findings"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="empty-state" class="empty-state" hidden></div>
      <nav id="pagination" class="pagination" hidden></nav>
    </section>
  </main>

  <div id="app-shell-footer"></div>

  <section id="assertions"></section>
  <div id="test-result"></div>

  <script type="module">
    import { STRINGS } from "/js/i18n.js";
    import { activityDate, formatDay, needsRecheck, sortedRowsFor } from "../js/index.js";

    const hour = 60 * 60 * 1000;
    const baseTime = Date.parse("2026-07-10T12:00:00.000Z");

    function iso(offsetHours) {
      return new Date(baseTime - offsetHours * hour).toISOString();
    }

    function makeRow(index, overrides = {}) {
      return {
        bill_id: `bill-${index}`,
        bill_number: `EELN-${String(index).padStart(3, "0")}`,
        title: `Tavaline eelnõu ${index}`,
        status: index % 5 === 0 ? null : (index % 2 === 0 ? "PROCESSED" : "IN_PROCESS"),
        active_stage: index % 5 === 0 ? null : (index % 2 === 0 ? "MENETLUSSE_VOETUD" : "I_LUGEMINE_LOPETATUD"),
        active_stage_date: `2026-06-${String(Math.max(1, 30 - index)).padStart(2, "0")}`,
        initiated_date: `2026-05-${String(Math.max(1, 30 - index)).padStart(2, "0")}`,
        last_seen_at: iso(index + 1),
        document_id: `doc-${index}`,
        doc_version: 1,
        doc_fetched_at: iso(index),
        text_status: "ok",
        text_formats: "html",
        text_checked_at: `2026-06-${String(Math.max(1, 30 - index)).padStart(2, "0")}`,
        text_length: 2000 + index,
        extraction_method: "html",
        analysis_id: `analysis-${index}`,
        analyzed_at: iso(index - 0.5),
        prompt_version: "p-test",
        model: "gpt-test",
        high_count: 0,
        medium_count: 0,
        low_count: 0,
        refuted_count: 0,
        ...overrides,
      };
    }

    const FIXTURE_ROWS = Array.from({ length: 30 }, (_, index) => makeRow(index + 1));

    Object.assign(FIXTURE_ROWS[0], {
      title: "Kõrge mõjuga andmekogu muudatus",
      high_count: 1,
      medium_count: 2,
    });
    Object.assign(FIXTURE_ROWS[9], {
      title: "Kõrge mõjuga menetlustähtaja muudatus",
      high_count: 2,
      low_count: 1,
    });
    Object.assign(FIXTURE_ROWS[19], {
      title: "Kõrge mõjuga aruandluse muudatus",
      high_count: 1,
    });
    Object.assign(FIXTURE_ROWS[3], {
      title: "Analüüsimata eelnõu neljas",
      analysis_id: null,
      analyzed_at: null,
    });
    Object.assign(FIXTURE_ROWS[7], {
      title: "Analüüsimata eelnõu kaheksas",
      analysis_id: null,
      analyzed_at: null,
    });
    Object.assign(FIXTURE_ROWS[11], {
      title: "Tekstita menetlus esimene",
      active_stage_date: "2026-07-30",
      document_id: null,
      text_status: "unsupported_format",
      text_formats: "doc,pdf",
      text_checked_at: "2026-07-30",
      analysis_id: null,
      analyzed_at: null,
    });
    Object.assign(FIXTURE_ROWS[15], {
      title: "Tekstita menetlus teine",
      document_id: null,
      text_status: "image_only_pdf",
      text_formats: "pdf",
      text_checked_at: "2026-06-15",
      analysis_id: null,
      analyzed_at: null,
    });
    Object.assign(FIXTURE_ROWS[5], {
      title: "Refuteeritud leidudega kontrollrida",
      medium_count: 1,
      refuted_count: 3,
    });
    Object.assign(FIXTURE_ROWS[6], {
      title: "Unikaalne otsingupealkiri kohaliku teenuse kohta",
      low_count: 2,
    });
    Object.assign(FIXTURE_ROWS[2], {
      title: "Koondstaatusega eelnõu kolmas",
      active_stage: null,
    });
    Object.assign(FIXTURE_ROWS[4], {
      title: "Liikunud tekstiga eelnõu viies",
      active_stage_date: "2026-07-20",
      text_checked_at: "2026-07-10",
    });
    Object.assign(FIXTURE_ROWS[8], {
      title: "Ajakohase tekstiga eelnõu üheksas",
      active_stage_date: "2026-07-12",
      text_checked_at: "2026-07-12",
    });

    window.__LAWLAB_INDEX_FIXTURE__ = FIXTURE_ROWS;

    window.LawlabIndex.init(FIXTURE_ROWS);

    const assertions = [];
    const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));
    const visibleRows = () => Array.from(document.querySelectorAll("#bill-table tbody tr"));
    const card = (name) => document.querySelector(`[data-filter-card="${name}"]`);
    const search = document.getElementById("index-search");
    const status = document.getElementById("status-filter");

    function appendAssert(name, passed, detail = "") {
      assertions.push(passed);
      const div = document.createElement("div");
      div.className = `assert${passed ? "" : " fail"}`;
      div.dataset.name = name;
      div.textContent = `${name}: ${passed ? "PASS" : "FAIL"}${detail ? ` ${detail}` : ""}`;
      document.getElementById("assertions").appendChild(div);
    }

    async function resetFilters() {
      card("total").click();
      search.value = "";
      search.dispatchEvent(new Event("input", { bubbles: true }));
      status.value = "all";
      status.dispatchEvent(new Event("change", { bubbles: true }));
      await wait(SEARCH_DELAY_MS + 30);
    }

    const SEARCH_DELAY_MS = 150;

    function rowsWithSeverity(level) {
      return FIXTURE_ROWS.filter((row) => Number(row[`${level}_count`]) > 0).length;
    }

    function runStatCards() {
      const names = ["total", "high", "medium", "low"];
      const expectedLabels = ["Eelnõusid kokku", "Kõrge risk", "Keskmine risk", "Madal risk"];
      const labels = names.map((name) => card(name)?.querySelector(".stat-label")?.textContent);
      appendAssert("stat-card-labels", JSON.stringify(labels) === JSON.stringify(expectedLabels), labels.join("|"));

      const analyzed = FIXTURE_ROWS.filter((row) => row.analysis_id != null).length;
      const noText = FIXTURE_ROWS.filter((row) => row.document_id == null).length;
      const subs = names.map((name) => card(name)?.querySelector(".stat-sub")?.textContent);
      const subsOk = subs[0] === `${analyzed} ${STRINGS.stat_analyzed_sub} · ${noText} ${STRINGS.stat_no_text_sub}`
        && subs.slice(1).every((sub) => sub === STRINGS.stat_click_filter);
      appendAssert("stat-card-subtexts", subsOk, subs.join("|"));

      const expected = {
        total: FIXTURE_ROWS.length,
        high: rowsWithSeverity("high"),
        medium: rowsWithSeverity("medium"),
        low: rowsWithSeverity("low"),
      };
      const actual = Object.fromEntries(names.map((name) => [
        name,
        Number(card(name).querySelector(".stat-value").textContent),
      ]));
      appendAssert("stat-counts", JSON.stringify(actual) === JSON.stringify(expected), `${JSON.stringify(actual)} expected ${JSON.stringify(expected)}`);
    }

    function runRiskCardFilters() {
      for (const level of ["high", "medium", "low"]) {
        card(level).click();
        appendAssert(
          `card-filter-${level}`,
          visibleRows().length === rowsWithSeverity(level) && card(level).getAttribute("aria-pressed") === "true",
          `rows=${visibleRows().length} expected=${rowsWithSeverity(level)}`
        );
        card(level).click();
        appendAssert(
          `card-toggle-${level}`,
          visibleRows().length === 25 && card(level).getAttribute("aria-pressed") === "false",
          `rows=${visibleRows().length}`
        );
      }
      card("medium").click();
      card("total").click();
      appendAssert("card-total-clears", visibleRows().length === 25, `rows=${visibleRows().length}`);
    }

    async function runSearchFilter() {
      await resetFilters();
      search.value = "otsingupealkiri";
      search.dispatchEvent(new Event("input", { bubbles: true }));
      await wait(SEARCH_DELAY_MS + 30);
      const rows = visibleRows();
      appendAssert("search-filter", rows.length === 1 && rows[0].textContent.includes("Unikaalne otsingupealkiri"), `rows=${rows.length}`);
    }

    async function runStatusFilter() {
      await resetFilters();
      const optionValues = Array.from(status.options).map((option) => option.value);
      const optionsOk = optionValues.join("|") === "all|I_LUGEMINE_LOPETATUD|MENETLUSSE_VOETUD"
        && status.options[0].textContent === STRINGS.status_all;
      appendAssert("status-options", optionsOk, optionValues.join("|"));

      status.value = "MENETLUSSE_VOETUD";
      status.dispatchEvent(new Event("change", { bubbles: true }));
      const rows = visibleRows();
      const expected = FIXTURE_ROWS.filter((row) => row.active_stage === "MENETLUSSE_VOETUD").length;
      appendAssert(
        "status-filter",
        rows.length === expected && rows.every((row) => row.dataset.status === "MENETLUSSE_VOETUD" && row.children[2].textContent === "MENETLUSSE_VOETUD"),
        `rows=${rows.length} expected=${expected}`
      );
    }

    async function runStageFallback() {
      await resetFilters();
      search.value = "Koondstaatusega eelnõu";
      search.dispatchEvent(new Event("input", { bubbles: true }));
      await wait(SEARCH_DELAY_MS + 30);
      const rows = visibleRows();
      appendAssert(
        "stage-fallback",
        rows.length === 1 && rows[0].children[2].textContent === STRINGS.status_IN_PROCESS,
        rows[0]?.children[2]?.textContent || `rows=${rows.length}`
      );
    }

    async function runNoTextState() {
      await resetFilters();
      search.value = "Tekstita menetlus esimene";
      search.dispatchEvent(new Event("input", { bubbles: true }));
      await wait(SEARCH_DELAY_MS + 30);
      const noText = document.querySelector(".no-text");
      const expectedTitle = `${STRINGS.text_status_unsupported_format} (doc,pdf)`;
      appendAssert(
        "no-text-state",
        noText?.textContent === STRINGS.state_no_text && noText?.title === expectedTitle,
        `${noText?.textContent || ""} title=${noText?.title || ""}`
      );
    }

    async function runActivityOrdering() {
      await resetFilters();
      const first = visibleRows()[0];
      appendAssert(
        "activity-sort-first",
        first?.textContent.includes("Tekstita menetlus esimene") && first?.children[3]?.textContent.trim() === "30.07.2026",
        first?.textContent || ""
      );
      appendAssert(
        "activity-helpers",
        activityDate(FIXTURE_ROWS[11]) === "2026-07-30"
          && formatDay("2026-07-30") === "30.07.2026"
          && sortedRowsFor(FIXTURE_ROWS)[0].bill_id === FIXTURE_ROWS[11].bill_id,
        `${activityDate(FIXTURE_ROWS[11])} ${formatDay("2026-07-30")}`
      );
    }

    async function runRecheckMarker() {
      await resetFilters();
      search.value = "Liikunud tekstiga eelnõu";
      search.dispatchEvent(new Event("input", { bubbles: true }));
      await wait(SEARCH_DELAY_MS + 30);
      const moved = visibleRows()[0];
      appendAssert(
        "recheck-marker-present",
        needsRecheck(FIXTURE_ROWS[4]) && moved?.children[3]?.textContent.includes(STRINGS.state_recheck),
        moved?.children[3]?.textContent || ""
      );

      search.value = "Ajakohase tekstiga eelnõu";
      search.dispatchEvent(new Event("input", { bubbles: true }));
      await wait(SEARCH_DELAY_MS + 30);
      const current = visibleRows()[0];
      appendAssert(
        "recheck-marker-absent",
        !needsRecheck(FIXTURE_ROWS[8]) && !current?.children[3]?.textContent.includes(STRINGS.state_recheck),
        current?.children[3]?.textContent || ""
      );
    }

    async function runPagination() {
      await resetFilters();
      const pageTwo = document.querySelector('#pagination button[data-page="2"]');
      const firstPageCount = visibleRows().length;
      pageTwo?.click();
      const secondPageCount = visibleRows().length;
      appendAssert("pagination", !!pageTwo && firstPageCount === 25 && secondPageCount === 5, `first=${firstPageCount} second=${secondPageCount}`);
    }

    appendAssert("search-placeholder", search.placeholder === STRINGS.search_ph, search.placeholder);
    runStatCards();
    runRiskCardFilters();
    await runSearchFilter();
    await runStatusFilter();
    await runStageFallback();
    await runActivityOrdering();
    await runNoTextState();
    await runRecheckMarker();
    await runPagination();

    document.getElementById("test-result").textContent = assertions.every(Boolean) ? "ALL-PASS" : "FAIL";
  </script>
</body>
</html>

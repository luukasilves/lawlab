<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill detail harness</title>
<script type="importmap">
{
  "imports": {
    "/js/api.js": "./stubs-bill/api.js",
    "/js/i18n.js": "./stubs-bill/i18n.js",
    "api.js": "./stubs-bill/api.js",
    "i18n.js": "./stubs-bill/i18n.js"
  }
}
</script>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 16px; }
  #test-result { border: 1px solid #ccc; margin-bottom: 12px; padding: 8px; }
  #test-result.pass { border-color: #26734d; color: #26734d; }
  #test-result.fail { border-color: #a33; color: #a33; }
  .page-header { border-bottom: 1px solid #ddd; margin-bottom: 12px; padding-bottom: 12px; }
  .meta-grid { display: flex; gap: 8px; }
  .two-pane { display: grid; grid-template-columns: 1fr 430px; gap: 16px; }
  .doc-text { white-space: pre-wrap; }
  mark.HIGH { background: #fdebea; }
  mark.MEDIUM { background: #fff3dd; }
  mark.LOW { background: #eef1f4; }
</style>
</head>
<body>
<div id="test-result">RUNNING</div>
<header class="page-header">
  <div class="topline">
    <a id="backLink" href="/"></a>
    <a id="riigikoguLink" hidden></a>
  </div>
  <h1 id="billTitle"></h1>
  <div id="metaGrid" class="meta-grid"></div>
</header>
<main id="billApp" class="two-pane">
  <section class="doc-pane">
    <div id="docText" class="doc-text"></div>
  </section>
  <aside class="side-pane">
    <div class="section-title">
      <h2 id="resultsTitle"></h2>
      <span id="resultsCount"></span>
    </div>
    <div id="billState" hidden></div>
    <div id="analysisSummary"></div>
    <div id="findingsList"></div>
    <div id="refutedSection"></div>
    <div id="pipelinePanel"></div>
    <div id="historyPanel"></div>
    <div id="rawJsonPanel"></div>
  </aside>
</main>

<script type="module">
window.__LAWLAB_TEST__ = true;
window.__postFeedbackCalls = [];

const parsedText = [
  "Seaduseelnõu eesmärk on täpsustada menetluse korda ning parandada viidete kooskõla. Juhtivkomisjon märgib, et sama mõistet kasutatakse eelnõu eri osades ühtselt, kuid rakendussätetes on vaja säilitada selge piir.",
  "Paragrahvis 2 kirjeldatakse loa andmise aluseid, kontrolli ulatust ja aruannete esitamise tähtaegu. Sama lõike lõpus korratakse tingimust, mille tähendus sõltub eelmises lauses kasutatud viitest.",
  "Seletuskiri lisab, et muudatus ei loo uut kohustust, kuid normitekstis on sõnastus laiem. Komisjoni seletuse järgi tuleb andmed esitada seitse päeva pärast nõude saamist.",
  "Rakendussätetes kirjeldatakse jõustumist, seoseid teiste seadustega ja andmete avaldamise korda."
].join("\n\n");

const analysis = {
  id: "analysis-current",
  doc_version: "v1",
  prompt_version: "prompt-v3",
  checker_version: "checker-v2",
  model: "test-model",
  provider: "test-provider",
  duration_ms: 12450,
  input_tokens: 2200,
  output_tokens: 900,
  cost_usd: 0.1234,
  engine: {
    provider: "test-provider",
    model: "test-model",
    params: { samples: 5, k: 3, temperature: 0.4 },
    checks: [["deterministic-structural", "1.2"]],
    passes: [["interpretive", "1.0", "sha-a"], ["refute", "1.0", "sha-b"]]
  },
  stats: {
    llm: {
      clusters: [
        { title: "Korduv vastuolu", category: "logical_contradiction", support: 5, n: 5, kept: true, members: ["B"] },
        { title: "Alla läve klaster", category: "terminology", support: 2, n: 5, kept: false, members: ["x", "y"] }
      ]
    },
    refute: { judged: 4, refuted: 1 }
  },
  findings: [
    {
      id: "A",
      source: "deterministic",
      check_id: "deterministic-structural",
      category: "structural_integrity",
      severity: "HIGH",
      confidence: 0.98,
      provision_id: "§ 1",
      location: "§ 1 lõige 1",
      evidence_quote: parsedText.slice(50, 120),
      char_start: 50,
      char_end: 120,
      title: "Deterministlik kattuv leid",
      description: "Tekstilõigus on struktuurne ebakõla.",
      reasoning: "Reegel leidis vastuolu viite ja lõike vahel.",
      suggestion: "Täpsustada viide.",
      honte_rule: "HÕNTE § 16",
      skeptic_verdict: "not_checked",
      skeptic_reasoning: ""
    },
    {
      id: "B",
      source: "llm",
      check_id: "interpretive",
      category: "logical_contradiction",
      severity: "MEDIUM",
      confidence: 0.8,
      runs_found: 4,
      runs_total: 5,
      provision_id: "§ 2",
      location: "§ 2 lõige 3",
      evidence_quote: parsedText.slice(100, 180),
      char_start: 100,
      char_end: 180,
      title: "Mudeli kattuv leid",
      description: "Tõlgenduslik kontroll leidis võimaliku vastuolu.",
      reasoning: "Neljas valimis viiest jäi sama lõik esile.",
      suggestion: "Ühtlustada sõnastus.",
      honte_rule: "HÕNTE § 17",
      skeptic_verdict: "upheld",
      skeptic_reasoning: "Skeptik nõustus, et leid on tekstiga seotud."
    },
    {
      id: "C",
      source: "llm",
      check_id: "interpretive",
      category: "linguistic_ambiguity",
      severity: "LOW",
      confidence: 0.62,
      runs_found: 3,
      runs_total: 5,
      provision_id: "§ 1",
      location: "§ 1 lõige 1",
      evidence_quote: parsedText.slice(60, 90),
      char_start: 60,
      char_end: 90,
      title: "Täielikult pesastatud leid",
      description: "See leid on täielikult A sees.",
      reasoning: "Piirid asuvad suurema leiu sees.",
      suggestion: "Kontrollida terminit.",
      honte_rule: "HÕNTE § 15",
      skeptic_verdict: "not_checked",
      skeptic_reasoning: ""
    },
    {
      id: "D",
      source: "llm",
      check_id: "interpretive",
      category: "terminology",
      severity: "LOW",
      confidence: 0.55,
      runs_found: 3,
      runs_total: 5,
      provision_id: "§ 3",
      location: "§ 3 lõige 1",
      evidence_quote: parsedText.slice(200, 260),
      char_start: 200,
      char_end: 260,
      title: "Ümber lükatud leid",
      description: "See leid ei peaks dokumendis märgitud olema.",
      reasoning: "Algne mudel luges lõiku liiga laialt.",
      suggestion: "Tagasiside puudub.",
      honte_rule: "HÕNTE § 17",
      skeptic_verdict: "refuted",
      skeptic_reasoning: "Skeptik leidis, et normitekst ei toeta seda väidet."
    }
  ]
};

const samplesMeta = [
  { id: "s1", pass_id: "interpretive", sample_idx: 1, temperature: 0.4, returned_count: 5, grounded_count: 5, dropped_ungrounded: 0, reused: false, duration_ms: 1000, input_tokens: 100, output_tokens: 50, cost_usd: 0.01 },
  { id: "s2", pass_id: "interpretive", sample_idx: 2, temperature: 0.4, returned_count: 4, grounded_count: 4, dropped_ungrounded: 0, reused: false, duration_ms: 1100, input_tokens: 101, output_tokens: 51, cost_usd: 0.011 },
  { id: "s3", pass_id: "interpretive", sample_idx: 3, temperature: 0.4, returned_count: 6, grounded_count: 5, dropped_ungrounded: 1, reused: false, duration_ms: 1200, input_tokens: 102, output_tokens: 52, cost_usd: 0.012 },
  { id: "s4", pass_id: "interpretive", sample_idx: 4, temperature: 0.4, returned_count: 5, grounded_count: 5, dropped_ungrounded: 0, reused: true, duration_ms: 10, input_tokens: 0, output_tokens: 0, cost_usd: 0 },
  { id: "s5", pass_id: "interpretive", sample_idx: 5, temperature: 0.4, returned_count: 5, grounded_count: 5, dropped_ungrounded: 0, reused: false, duration_ms: 1300, input_tokens: 103, output_tokens: 53, cost_usd: 0.013 },
  { id: "r1", pass_id: "refute", sample_idx: 1, temperature: 0, returned_count: 1, grounded_count: 1, dropped_ungrounded: 0, reused: false, duration_ms: 500, input_tokens: 80, output_tokens: 40, cost_usd: 0.005 }
];

const fixture = {
  bill: {
    id: "bill-row-1",
    bill_number: "123 SE",
    title: "Testseaduse muutmise seadus",
    api_data: {
      uuid: "11111111-2222-3333-4444-555555555555",
      draftTypeCode: "SE",
      leadingCommittee: { name: "Õiguskomisjon" },
      activeDraftStatusDate: "2026-07-01T12:00:00Z"
    },
    text_checked_at: "2026-07-01T10:00:00Z",
    last_seen_at: "2026-07-01T12:00:00Z",
    bill_documents: [
      { id: "doc-v1", document_type: "eelnõu", doc_version: "v1", fetched_at: "2026-07-01T10:00:00Z", text_length: parsedText.length, extraction_method: "html" }
    ]
  },
  history: [
    { analysis_id: "analysis-current", doc_version: "v1", created_at: "2026-07-02T10:00:00Z", prompt_version: "prompt-v3", checker_version: "checker-v2", model: "test-model", provider: "test-provider", duration_ms: 12450, cost_usd: 0.1234, finding_count: 3, refuted_count: 1 },
    { analysis_id: "analysis-old", doc_version: "v0", created_at: "2026-06-01T10:00:00Z", prompt_version: "prompt-v2", checker_version: "checker-v1", model: "old-model", provider: "test-provider", duration_ms: 9000, cost_usd: 0.08, finding_count: 1, refuted_count: 0 }
  ],
  analysis,
  analysesById: {
    "analysis-current": analysis,
    "analysis-old": { ...analysis, id: "analysis-old", findings: [analysis.findings[0]], stats: { llm: { clusters: [] }, refute: { judged: 1, refuted: 0 } } }
  },
  parsedText: { parsed_text: parsedText },
  samplesMeta,
  samplesByAnalysis: {
    "analysis-current": samplesMeta,
    "analysis-old": []
  },
  config: { SUPABASE_URL: "https://example.supabase.co" }
};
window.__LAWLAB_FIXTURE__ = fixture;

const methodology = {
  checks: [
    { id: "deterministic-structural", name_et: "Struktuurikontroll", name_en: "Structural check" }
  ],
  passes: [
    { id: "interpretive", name_et: "Tõlgenduslik valim", name_en: "Interpretive sample" },
    { id: "refute", name_et: "Skeptiku kontroll", name_en: "Skeptic check" }
  ],
  categories: [
    { key: "structural_integrity", label_et: "Struktuuriterviklus", label_en: "Structural integrity", honte_citation: "HÕNTE § 16" },
    { key: "logical_contradiction", label_et: "Loogiline vastuolu", label_en: "Logical contradiction", honte_citation: "HÕNTE § 16" },
    { key: "linguistic_ambiguity", label_et: "Keeleline ühemõttelisus", label_en: "Linguistic ambiguity", honte_citation: "HÕNTE § 15" },
    { key: "terminology", label_et: "Terminoloogia", label_en: "Terminology", honte_citation: "HÕNTE § 17" }
  ]
};

const originalFetch = window.fetch.bind(window);
window.fetch = async (url, options) => {
  if (String(url).endsWith("/data/methodology.json")) {
    return new Response(JSON.stringify(methodology), {
      status: 200,
      headers: { "Content-Type": "application/json" }
    });
  }
  return originalFetch(url, options);
};

function assert(condition, message) {
  if (!condition) {
    throw new Error(message);
  }
}

function tick() {
  return new Promise((resolve) => window.setTimeout(resolve, 0));
}

function clone(value) {
  return structuredClone(value);
}

function stateFixture(overrides = {}) {
  const next = clone(fixture);
  next.bill = {
    ...next.bill,
    id: overrides.id || next.bill.id,
    title: overrides.title || next.bill.title,
    text_status: overrides.text_status ?? next.bill.text_status,
    text_formats: overrides.text_formats ?? next.bill.text_formats,
    text_checked_at: overrides.text_checked_at ?? next.bill.text_checked_at,
    last_seen_at: overrides.last_seen_at ?? next.bill.last_seen_at,
    api_data: {
      ...next.bill.api_data,
      ...(overrides.api_data || {})
    },
    bill_documents: overrides.bill_documents ?? next.bill.bill_documents
  };
  next.analysis = overrides.analysis === undefined ? next.analysis : overrides.analysis;
  next.history = overrides.history === undefined ? next.history : overrides.history;
  next.parsedText = overrides.parsedText === undefined ? next.parsedText : overrides.parsedText;
  next.samplesMeta = overrides.samplesMeta === undefined ? next.samplesMeta : overrides.samplesMeta;
  next.analysesById = overrides.analysesById === undefined ? next.analysesById : overrides.analysesById;
  next.samplesByAnalysis = overrides.samplesByAnalysis === undefined ? next.samplesByAnalysis : overrides.samplesByAnalysis;
  return next;
}

function metaValue(label) {
  return Array.from(document.querySelectorAll("#metaGrid .meta-card"))
    .find((card) => card.querySelector(".meta-label")?.textContent === label)
    ?.querySelector(".meta-value")?.textContent || "";
}

function visibleBillText() {
  return [
    document.getElementById("docText")?.textContent || "",
    document.getElementById("analysisSummary")?.textContent || "",
    document.getElementById("findingsList")?.textContent || "",
    document.getElementById("refutedSection")?.textContent || "",
    document.getElementById("pipelinePanel")?.textContent || "",
    document.getElementById("historyPanel")?.textContent || "",
    document.getElementById("rawJsonPanel")?.textContent || ""
  ].join("\n");
}

try {
  await import("../js/bill.js");
  await window.LawlabBill.init(fixture);
  const { latestDocument, billStateFor } = window.LawlabBill;
  assert(latestDocument(fixture.bill)?.id === "doc-v1", "assert-latest-document: expected eelnõu document");
  assert(billStateFor(fixture.bill, analysis.id) === "analysed", "assert-bill-state-analysed: expected analysed");

  const overlapAnchors = {
    A: document.getElementById("mark-A"),
    B: document.getElementById("mark-B"),
    C: document.getElementById("mark-C")
  };
  const missingOverlapAnchors = Object.entries(overlapAnchors)
    .filter(([, node]) => !node)
    .map(([id]) => id);
  assert(missingOverlapAnchors.length === 0, `assert-overlap-anchors: missing ${missingOverlapAnchors.join(", ")}`);
  assert(!document.getElementById("mark-D"), "assert-refuted-not-marked: D should not be highlighted");

  const refutedCard = document.querySelector("#refutedSection #finding-D");
  assert(refutedCard, "assert-refuted-section: missing D card");
  assert(refutedCard.textContent.includes("Skeptik leidis, et normitekst ei toeta seda väidet."), "assert-refuted-section: missing skeptic reasoning");

  assert(document.getElementById("pipelinePanel").textContent.includes("alla läve"), "assert-subthreshold-visible: missing below-threshold cluster");

  const sampleRows = Array.from(document.querySelectorAll(".sample-table tr.sample-row"));
  assert(sampleRows.length === 5, `assert-sample-table: expected 5 rows, got ${sampleRows.length}`);
  assert(sampleRows.some((row) => row.textContent.includes("taaskasutatud")), "assert-sample-table: missing reused chip");

  const confirmButton = document.querySelector("#finding-B button[data-feedback='confirm']");
  assert(confirmButton, "assert-feedback-flow: missing confirm button");
  confirmButton.click();
  await tick();
  assert(window.__postFeedbackCalls.length === 1, "assert-feedback-flow: postFeedback was not called");
  assert(window.__postFeedbackCalls[0].findingId === "B", "assert-feedback-flow: wrong finding id");
  assert(window.__postFeedbackCalls[0].verdict === "confirm", "assert-feedback-flow: wrong verdict");
  assert(document.getElementById("finding-B").textContent.includes("Aitäh tagasiside eest"), "assert-feedback-flow: missing thanks text");

  assert(document.getElementById("finding-B").textContent.includes("Kooskõla: 4/5"), "assert-agreement-badge: missing agreement text");

  const severityBadge = document.querySelector("#finding-A .badge.severity");
  assert(severityBadge?.textContent === "Kõrge", `assert-severity-word: got ${severityBadge?.textContent}`);
  assert(severityBadge?.classList.contains("HIGH"), "assert-severity-word: missing HIGH class");
  const mediumBadge = document.querySelector("#finding-B .badge.severity");
  assert(mediumBadge?.textContent === "Keskmine", `assert-severity-word: got ${mediumBadge?.textContent}`);

  const metaGridText = document.getElementById("metaGrid").textContent;
  assert(metaGridText.includes("Prompt versioon"), "assert-prompt-card: missing label");
  assert(metaGridText.includes("prompt-v3 — Tõlgenduslik valim"), "assert-prompt-card: missing version — pass name value");

  const summaryLine = document.getElementById("analysisSummary").textContent;
  assert(
    summaryLine.startsWith("Analüüsitud: ") && summaryLine.includes(" märki")
      && summaryLine.includes("Dokumendid: eelnõu") && summaryLine.includes("Prompt: prompt-v3"),
    `assert-analysis-summary: got ${summaryLine}`
  );

  const historyRows = document.querySelectorAll(".history-row");
  assert(historyRows.length === 2, `assert-history-renders: expected 2 rows, got ${historyRows.length}`);
  const historySummary = document.querySelector("#historyPanel summary");
  assert(historySummary?.textContent === "Analüüside ajalugu (2)", `assert-history-count: got ${historySummary?.textContent}`);

  const noTextReason = "Eelnõu on avaldatud ainult vormingus, mida ei õnnestu lugeda (doc,pdf)";
  const noTextFixture = stateFixture({
    id: "bill-no-text",
    title: "Loetamatu vorminguga eelnõu",
    text_status: "unsupported_format",
    text_formats: "doc,pdf",
    text_checked_at: "2026-07-04T10:00:00Z",
    last_seen_at: "2026-07-04T10:00:00Z",
    bill_documents: [],
    analysis: null,
    history: [],
    parsedText: { parsed_text: "" },
    samplesMeta: [],
    analysesById: {},
    samplesByAnalysis: {}
  });
  await window.LawlabBill.init(noTextFixture);
  assert(billStateFor(noTextFixture.bill, "") === "no_text", "assert-no-text-state-helper: expected no_text");
  assert(document.querySelector("#docText .state-panel")?.textContent.includes(noTextReason), "assert-no-text-doc-panel: missing reason");
  assert(document.querySelector("#findingsList .state-panel")?.textContent.includes(noTextReason), "assert-no-text-findings-panel: missing reason");
  assert(!visibleBillText().includes("Avaldatavaid leide ei tuvastatud."), "assert-no-text-no-zero-copy: zero findings copy visible");
  assert(document.getElementById("analysisSummary").textContent === "", "assert-no-text-summary-empty: summary not empty");
  assert(document.getElementById("resultsCount").textContent === "", "assert-no-text-count-empty: count not empty");
  assert(document.getElementById("pipelinePanel").textContent === "", "assert-no-text-pipeline-empty: pipeline not empty");
  assert(metaValue("Viimati uuendatud") && metaValue("Viimati uuendatud") !== "-", `assert-no-text-updated: got ${metaValue("Viimati uuendatud")}`);

  const memoOnlyFixture = stateFixture({
    id: "bill-memo-only",
    title: "Ainult seletuskirjaga eelnõu",
    text_status: "unsupported_format",
    text_formats: "doc,pdf",
    text_checked_at: "2026-07-05T10:00:00Z",
    last_seen_at: "2026-07-05T10:00:00Z",
    bill_documents: [
      { id: "memo-1", document_type: "seletuskiri", doc_version: "memo-v1", fetched_at: "2026-07-05T10:00:00Z", text_length: 500 }
    ],
    analysis: null,
    history: [],
    parsedText: { parsed_text: "Memo tekst ei tohi dokumendina renderduda." },
    samplesMeta: [],
    analysesById: {},
    samplesByAnalysis: {}
  });
  await window.LawlabBill.init(memoOnlyFixture);
  assert(latestDocument(memoOnlyFixture.bill) == null, "assert-memo-ignored-helper: memo should not be latest document");
  assert(billStateFor(memoOnlyFixture.bill, "") === "no_text", "assert-memo-no-text-state: expected no_text");
  assert(document.querySelector("#docText .state-panel")?.textContent.includes(noTextReason), "assert-memo-doc-panel: missing no-text reason");
  assert(document.querySelector("#findingsList .state-panel")?.textContent.includes(noTextReason), "assert-memo-findings-panel: missing no-text reason");
  assert(!document.getElementById("docText").textContent.includes("Memo tekst"), "assert-memo-not-rendered: memo text rendered");

  const pendingText = "Analüüsimata dokumendi tekst on kasutajale nähtav.";
  const pendingFixture = stateFixture({
    id: "bill-pending-analysis",
    title: "Analüüsi ootav eelnõu",
    bill_documents: [
      { id: "doc-pending", document_type: "eelnõu", doc_version: "v1", fetched_at: "2026-07-06T10:00:00Z", text_length: pendingText.length }
    ],
    analysis: null,
    history: [],
    parsedText: { parsed_text: pendingText },
    samplesMeta: [],
    analysesById: {},
    samplesByAnalysis: {}
  });
  await window.LawlabBill.init(pendingFixture);
  assert(billStateFor(pendingFixture.bill, "") === "pending_analysis", "assert-pending-state-helper: expected pending_analysis");
  assert(document.getElementById("docText").textContent.includes(pendingText), "assert-pending-doc-text: document text missing");
  assert(document.querySelector("#findingsList .state-panel")?.textContent.includes("Veel analüüsimata"), "assert-pending-panel-label: missing label");
  assert(document.querySelector("#findingsList .state-panel")?.textContent.includes("Analüüs käivitub järgmise automaatse kontrolliga."), "assert-pending-panel-note: missing note");
  assert(document.getElementById("analysisSummary").textContent === "", "assert-pending-summary-empty: summary not empty");
  assert(document.getElementById("resultsCount").textContent === "", "assert-pending-count-empty: count not empty");

  const recheckFixture = stateFixture({
    id: "bill-recheck",
    title: "Liikunud analüüsitud eelnõu",
    text_checked_at: "2026-07-01T10:00:00Z",
    api_data: { activeDraftStatusDate: "2026-07-08T12:00:00Z" }
  });
  await window.LawlabBill.init(recheckFixture);
  assert(billStateFor(recheckFixture.bill, analysis.id) === "recheck_pending", "assert-recheck-state-helper: expected recheck_pending");
  assert(!document.getElementById("billState").hidden, "assert-recheck-note-visible: note hidden");
  assert(document.getElementById("billState").textContent.includes("uuesti kontrollimine on ootel"), "assert-recheck-note-text: missing note");
  assert(document.getElementById("resultsCount").textContent === "3", `assert-recheck-results-normal: got ${document.getElementById("resultsCount").textContent}`);
  assert(document.getElementById("finding-A"), "assert-recheck-findings-normal: findings missing");

  const result = document.getElementById("test-result");
  result.className = "pass";
  result.textContent = "ALL-PASS";
} catch (error) {
  console.error(error);
  const result = document.getElementById("test-result");
  result.className = "fail";
  result.textContent = `FAIL ${error.message}`;
}
</script>
</body>
</html>

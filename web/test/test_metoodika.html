<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<title>metoodika test</title>
<script type="importmap">
{
  "imports": {
    "i18n": "./stubs-met/i18n.js",
    "shell": "./stubs-met/shell.js"
  }
}
</script>
</head>
<body>
<main id="metoodika-root"></main>
<pre id="test-result">RUNNING</pre>
<script>
const realFetch = window.fetch.bind(window);
window.__fixturePromise = realFetch("../data/methodology.json").then((response) => response.json());
window.fetch = async (resource, init) => {
  const url = typeof resource === "string" ? resource : resource.url;
  if (url && url.endsWith("/data/methodology.json")) {
    const fixture = await window.__fixturePromise;
    return new Response(JSON.stringify(fixture), {
      headers: { "Content-Type": "application/json" },
      status: 200
    });
  }
  return realFetch(resource, init);
};
</script>
<script type="module">
import { setLang } from "i18n";
import "../js/metoodika.js";

const result = document.getElementById("test-result");

function assert(condition, name) {
  if (!condition) throw new Error(name);
}

function text(selector) {
  return Array.from(document.querySelectorAll(selector)).map((node) => node.textContent).join("\n");
}

async function run() {
  const fixture = await window.__fixturePromise;
  await window.LawlabMetoodika.ready;
  setLang("et");
  window.LawlabMetoodika.init(fixture);

  assert(document.querySelector("h1")?.textContent === "About" && document.title === "About", "about-title");

  const sectionHeads = text("section h2, section h3");
  const parityHeads = ["Andmeallikad", "Riigikogu API", "Dokumendid", "Andmete uuendamine", "AI mudel", "Teksti piirang", "Süsteemi promptid"];
  assert(parityHeads.every((head) => sectionHeads.includes(head)), "parity-sections");

  const story = document.getElementById("lugu");
  assert(
    story && story.querySelectorAll("p").length >= 3 && story.textContent.includes("teine versioon"),
    "story-section"
  );

  const downloads = document.getElementById("allalaadimine");
  assert(
    downloads &&
      downloads.querySelectorAll(".download-row").length === 5 &&
      downloads.querySelectorAll(".download-btn").length === 7 &&
      downloads.querySelector('.download-row[data-dataset="findings"]'),
    "downloads-section"
  );
  assert(
    document.querySelector('.prompt-detail[data-pass-id="interpretive"] summary')?.textContent === "Näita ic-v1 prompti",
    "show-prompt-label"
  );

  const checksText = text("#checks-table tbody");
  const etCheckNames = ["Paragrahvide numeratsioon", "Muutmispunktide numeratsioon", "Jõustumissätte viited", "Protsendijaotuste aritmeetika"];
  assert(etCheckNames.every((name) => checksText.includes(name)), "checks-table");

  assert(
    ["interpretive", "refute"].every((passId) => {
      const detail = document.querySelector(`.prompt-detail[data-pass-id="${passId}"]`);
      return detail
        && detail.querySelector(".system-prompt")?.textContent.trim().length > 50
        && detail.querySelector(".user-template")?.textContent.trim().length > 0;
    }),
    "prompts-visible"
  );

  const categoryRows = document.querySelectorAll("#categories-table tbody tr");
  assert(categoryRows.length === 8 && Array.from(categoryRows).every((row) => row.textContent.includes("HÕNTE")), "categories-honte");

  assert(document.querySelectorAll(".limitations li").length === 5, "limitations");
  assert(
    text(".limitations li").includes("ei koosta muudetava seaduse tulevast tervikteksti"),
    "limitations-future-text"
  );

  const andmed = document.getElementById("andmed");
  assert(
    andmed &&
      andmed.querySelectorAll(".curl-example").length === 3 &&
      andmed.querySelector('a[href="https://github.com/luukasilves/lawlab"]'),
    "andmed-section"
  );

  setLang("en");
  window.LawlabMetoodika.init(fixture);
  const enChecks = text("#checks-table tbody");
  const enCheckNames = ["Section numbering", "Amendment instruction numbering", "Entry-into-force references", "Percentage allocation arithmetic"];
  assert(enCheckNames.every((name) => enChecks.includes(name)), "lang-en");
  assert(document.getElementById("lugu")?.textContent.includes("second version"), "story-section-en");
  assert(
    text(".limitations li").includes("does not construct the future consolidated text"),
    "limitations-future-text-en"
  );
  assert(document.querySelector("h1")?.textContent === "About" && document.title === "About", "about-title-en");

  result.textContent = "ALL-PASS";
}

run().catch((error) => {
  result.textContent = `FAIL ${error.stack || error.message || error}`;
});
</script>
</body>
</html>

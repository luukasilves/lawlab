<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apsakaleidja</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    :root {
      --index-bg: #f7f8f5;
      --index-panel: #fff;
      --index-ink: #202124;
      --index-muted: #667085;
      --index-line: #d9ded6;
      --index-high: #b42318;
      --index-med: #b54708;
      --index-low: #475467;
      --index-green: #087443;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--index-bg);
      color: var(--index-ink);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .index-dashboard {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .index-top {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .index-top h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .freshness-line {
      color: var(--index-muted);
      font-size: 13px;
    }

    .banner-stale {
      width: fit-content;
      max-width: 100%;
      border: 1px solid #fedf89;
      background: #fffaeb;
      color: #93370d;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-card {
      min-height: 86px;
      border: 1px solid var(--index-line);
      border-radius: 8px;
      background: var(--index-panel);
      color: inherit;
      text-align: left;
      padding: 14px;
      cursor: pointer;
    }

    .stat-card.active {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px #2563eb inset;
    }

    .stat-value {
      display: block;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 700;
    }

    .stat-label {
      display: block;
      margin-top: 8px;
      color: var(--index-muted);
      font-size: 13px;
    }

    .index-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .index-controls input,
    .index-controls select {
      min-height: 40px;
      border: 1px solid var(--index-line);
      border-radius: 6px;
      background: #fff;
      color: inherit;
      font: inherit;
      padding: 0 10px;
    }

    .index-controls input {
      flex: 1 1 340px;
      min-width: 0;
    }

    .index-controls select {
      flex: 0 0 210px;
    }

    .table-wrap {
      border: 1px solid var(--index-line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--index-panel);
    }

    .index-table {
      width: 100%;
      border-collapse: collapse;
    }

    .index-table th,
    .index-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--index-line);
      text-align: left;
      vertical-align: middle;
    }

    .index-table th {
      color: var(--index-muted);
      font-size: 12px;
      font-weight: 650;
      text-transform: uppercase;
    }

    .index-table tbody tr {
      cursor: pointer;
    }

    .index-table tbody tr:hover {
      background: #f9fafb;
    }

    .index-table a {
      color: inherit;
      text-decoration: none;
      font-weight: 650;
    }

    .muted {
      color: var(--index-muted);
    }

    .zero-findings {
      color: var(--index-green);
      font-weight: 650;
    }

    .finding-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-flex;
      min-width: 28px;
      justify-content: center;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .chip.high {
      background: #fee4e2;
      color: var(--index-high);
    }

    .chip.med {
      background: #fef0c7;
      color: var(--index-med);
    }

    .chip.low {
      background: #f2f4f7;
      color: var(--index-low);
    }

    .empty-state {
      display: grid;
      min-height: 180px;
      place-items: center;
      color: var(--index-muted);
      text-align: center;
      padding: 24px;
    }

    .pagination {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      border-top: 1px solid var(--index-line);
      padding: 10px 12px;
      background: #fbfcfa;
    }

    .pagination button {
      min-width: 34px;
      min-height: 34px;
      border: 1px solid var(--index-line);
      border-radius: 6px;
      background: #fff;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .pagination button.active {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 700;
    }

    [hidden] { display: none !important; }

    @media (max-width: 760px) {
      .index-dashboard {
        width: min(100% - 20px, 1180px);
        padding-top: 16px;
      }

      .stat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .index-controls {
        align-items: stretch;
        flex-direction: column;
      }

      .index-controls select {
        flex-basis: auto;
      }

      .table-wrap {
        overflow-x: auto;
      }

      .index-table {
        min-width: 720px;
      }
    }
  </style>
</head>
<body>
  <div id="app-shell-header"></div>

  <main id="lawlab-index" class="index-dashboard">
    <header class="index-top">
      <h1>Apsakaleidja</h1>
      <div id="freshness-line" class="freshness-line"></div>
      <div id="stale-banner" class="banner-stale" hidden></div>
    </header>

    <section id="stat-cards" class="stat-grid"></section>

    <section class="index-controls">
      <input id="index-search" type="search" autocomplete="off">
      <select id="status-filter"></select>
    </section>

    <section class="table-wrap">
      <table id="bill-table" class="index-table">
        <thead>
          <tr>
            <th data-column="number"></th>
            <th data-column="title"></th>
            <th data-column="status"></th>
            <th data-column="changed"></th>
            <th data-column="findings"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="empty-state" class="empty-state" hidden></div>
      <nav id="pagination" class="pagination" hidden></nav>
    </section>
  </main>

  <div id="app-shell-footer"></div>

  <script type="module" src="/js/index.js"></script>
</body>
</html>

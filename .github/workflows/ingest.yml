name: ingest-and-analyze

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Prove the failure-notify path'
        type: boolean
        default: false
      recheck_bills:
        description: 'Comma-separated list of bill numbers to re-download despite the unchanged-bill skip'
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install LibreOffice for legacy .doc conversion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui || sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version
      - run: pip install -r requirements.txt
      - name: Force failure for notification test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fail }}
        run: exit 1
      - name: Ingest active draft bills
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LAWLAB_CORPUS_SINCE: '2026-01-01'
          LAWLAB_RECHECK_BILLS: ${{ inputs.recheck_bills }}
        run: python3 -m ingestion.run_ingest --max-pages 20

  analyze:
    needs: ingest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - name: Analyse new/changed bills
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: provider switch
        run: python3 -m ingestion.analyze_pending --max-bills-per-run 10

  notify-failure:
    needs: [ingest, analyze]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create --title "Pipeline run failed: $GITHUB_RUN_ID" --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
